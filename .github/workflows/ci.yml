name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Schema drift check
        run: npm run check:schema
      - name: Generated types are current
        run: npm run check:gen
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
